name: Build Nongki Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/capacitor-apk
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'service-worker.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Android wrapper branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Capacitor dependencies
        run: npm install

      - name: Bundle the stable local web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html manifest.json service-worker.js icon-192.png icon-512.png www/
          test -s www/index.html
          test -s www/service-worker.js
          echo "Bundled web app files:"
          ls -lh www/

      - name: Generate Android project
        run: npx cap add android

      - name: Sync local web assets into Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nongki-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
