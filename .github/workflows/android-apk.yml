name: Build Nongki Print Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/capacitor-print
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'service-worker.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Android wrapper branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Bundle the stable local web files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www
          cp index.html manifest.json service-worker.js icon-192.png icon-512.png www/
          cp scripts/print-ui.js www/print-ui.js
          test -s www/index.html
          test -s www/service-worker.js
          npm run build:print-bridge
          echo "Bundled web app files:"
          ls -lh www/

      - name: Generate Android project
        run: npx cap add android

      - name: Prepare approved Nongki launcher icon
        run: |
          mkdir -p assets
          node -e "require('sharp')('assets/nongki-icon.svg').resize(1024,1024).png().toFile('assets/icon.png').then(()=>console.log('Launcher icon prepared'))"
          npx capacitor-assets generate --android --iconBackgroundColor "#F8F7F2"

      - name: Match Android status bar to Nongki header
        run: python3 scripts/configure-android-statusbar.py

      - name: Sync local web assets into Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: nongki-print-test-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
