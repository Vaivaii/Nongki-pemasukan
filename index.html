<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nongki — POS & Pemasukan</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen flex flex-col justify-between select-none">

    <!-- TOP BAR -->
    <header class="bg-stone-800 border-b border-stone-700 p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid font-bold text-amber-500 text-xl">☕</i>
            <h1 class="font-bold text-lg tracking-wide">Nongki POS</h1>
        </div>
        <div id="connectionStatus" class="text-xs px-2.5 py-1 rounded-full bg-emerald-900/80 text-emerald-300 border border-emerald-700/50 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Online
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 p-4 pb-24 max-w-lg mx-auto w-full">

        <!-- TAB NAVIGATION -->
        <div class="flex bg-stone-800 p-1 rounded-xl mb-4 border border-stone-700">
            <button onclick="switchTab('pos')" id="tab-pos-btn" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-amber-600 text-white shadow">Kasir</button>
            <button onclick="switchTab('riwayat')" id="tab-riwayat-btn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-stone-400">Riwayat</button>
            <button onclick="switchTab('laporan')" id="tab-laporan-btn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-stone-400">Laporan</button>
        </div>

        <!-- SUMMARY CARD HARI INI -->
        <div class="bg-gradient-to-br from-stone-800 to-stone-850 p-4 rounded-2xl border border-stone-700 shadow-sm mb-4">
            <div class="text-xs text-stone-400 font-medium">Penjualan Global Hari Ini</div>
            <div class="text-2xl font-bold text-amber-400 mt-1" id="globalTodayTotal">Rp 0</div>
            <div class="text-[10px] text-stone-500 mt-1 flex justify-between">
                <span id="syncTimestamp">Belum sinkron</span>
                <span id="offlineQueueCount" class="text-amber-500/80 font-mono">0 antrean lokal</span>
            </div>
        </div>

        <!-- VIEWS -->
        <!-- 1. POS VIEW -->
        <div id="view-pos" class="space-y-4">
            <!-- CATEGORY FILTER -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1" id="categoryContainer">
                <button onclick="filterCategory('ALL')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 text-white whitespace-nowrap border border-amber-500">Semua</button>
            </div>

            <!-- MENU GRID -->
            <div class="grid grid-cols-2 gap-2.5" id="menuGrid">
                <div class="col-span-2 text-center py-8 text-stone-500 text-sm">Memuat menu...</div>
            </div>

            <!-- CART SUMMARY BAR (STICKY BOTTOM OVER TAB) -->
            <div id="cartBar" class="hidden fixed bottom-16 left-0 right-0 max-w-lg mx-auto px-4 z-30">
                <div class="bg-amber-600 text-white p-3 rounded-xl shadow-xl flex justify-between items-center cursor-pointer border border-amber-400/30" onclick="openCartModal()">
                    <div class="flex items-center gap-2">
                        <span id="cartBadge" class="bg-stone-900 text-amber-400 font-bold text-xs w-6 h-6 rounded-full flex items-center justify-center">0</span>
                        <span class="font-semibold text-sm">Pesanan</span>
                    </div>
                    <div class="font-bold text-base" id="cartTotalBar">Rp 0</div>
                </div>
            </div>
        </div>

        <!-- 2. RIWAYAT VIEW -->
        <div id="view-riwayat" class="hidden space-y-3">
            <div class="flex justify-between items-center text-xs text-stone-400 px-1">
                <span>Transaksi Terbaru (Lokal & Server)</span>
                <button onclick="refreshData()" class="text-amber-500 hover:underline"><i class="fa-solid fa-rotate text-xs"></i> Refresh</button>
            </div>
            <div id="historyList" class="space-y-2">
                <div class="text-center py-8 text-stone-500 text-sm">Belum ada riwayat transaksi.</div>
            </div>
        </div>

        <!-- 3. LAPORAN VIEW -->
        <div id="view-laporan" class="hidden space-y-4">
            <div class="bg-stone-800 p-4 rounded-xl border border-stone-700">
                <h3 class="font-bold text-sm text-stone-300 mb-2">Ringkasan Laporan</h3>
                <div class="grid grid-cols-2 gap-2 text-center">
                    <div class="bg-stone-900/60 p-3 rounded-lg border border-stone-700/50">
                        <div class="text-[10px] text-stone-400">Total Omset</div>
                        <div class="text-lg font-bold text-emerald-400 mt-0.5" id="reportOmset">Rp 0</div>
                    </div>
                    <div class="bg-stone-900/60 p-3 rounded-lg border border-stone-700/50">
                        <div class="text-[10px] text-stone-400">Total Transaksi</div>
                        <div class="text-lg font-bold text-amber-400 mt-0.5" id="reportTxCount">0</div>
                    </div>
                </div>
            </div>
            <div class="bg-stone-800 p-4 rounded-xl border border-stone-700">
                <h3 class="font-bold text-sm text-stone-300 mb-2">Item Terjual</h3>
                <div id="reportItemList" class="space-y-1.5 text-xs divide-y divide-stone-700/50">
                    <div class="text-stone-500 text-center py-4">Memuat data laporan...</div>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL CART & PAYMENT -->
    <div id="cartModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end justify-center sm:items-center p-0 sm:p-4">
        <div class="bg-stone-800 w-full max-w-lg rounded-t-2xl sm:rounded-2xl border border-stone-700 flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-stone-700 flex justify-between items-center">
                <h2 class="font-bold text-base">Detail Pesanan</h2>
                <button onclick="closeCartModal()" class="text-stone-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 divide-y divide-stone-700/60" id="cartItemsContainer">
                <!-- Cart items rendered here -->
            </div>
            <div class="p-4 border-t border-stone-700 space-y-3 bg-stone-850">
                <div class="flex justify-between items-center text-sm font-bold">
                    <span>Total</span>
                    <span class="text-amber-400 text-lg" id="modalTotalAmount">Rp 0</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnPayCash" onclick="processPayment('TUNAI')" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold text-sm transition">
                        <i class="fa-solid fa-money-bill-wave mr-1"></i> TUNAI
                    </button>
                    <button id="btnPayQRIS" onclick="processPayment('QRIS')" class="bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-bold text-sm transition">
                        <i class="fa-solid fa-qrcode mr-1"></i> QRIS
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT CORE -->
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfD0UvK-P2XwI1Cpx-8J6kC--L0x1vC4sXkYl_1V62b4iM2O6q3O1I-w2_8k/exec'; // Diperbarui sesuai deployment
        const API_TOKEN = 'nongki.12071992-23111996';

        let masterMenu = [];
        let cart = [];
        let activeCategory = 'ALL';
        let serverHistory = [];
        let serverGlobalIncome = 0;

        // HELPER TANGGAL GMT+7
        function getTodayWIB() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const wib = new Date(utc + (3600000 * 7));
            return wib.toISOString().split('T')[0];
        }

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            
            document.getElementById('tab-laporan-btn').addEventListener('click', () => {
                loadReportData();
            });
        });

        async function initApp() {
            loadLocalCart();
            renderCartUI();
            renderRecentTransactions();
            calculateGlobalTotal();
            await fetchMenu();
            await fetchGlobalTotal();
            await fetchServerHistory();
        }

        function switchTab(tabName) {
            ['pos', 'riwayat', 'laporan'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                const btn = document.getElementById(`tab-${t}-btn`);
                if (t === tabName) {
                    view.classList.remove('hidden');
                    btn.classList.add('bg-amber-600', 'text-white', 'shadow');
                    btn.classList.remove('text-stone-400');
                } else {
                    view.classList.add('hidden');
                    btn.classList.remove('bg-amber-600', 'text-white', 'shadow');
                    btn.classList.add('text-stone-400');
                }
            });
            if (tabName === 'riwayat') renderRecentTransactions();
        }

        // MENU FETCHING & RENDER
        async function fetchMenu() {
            try {
                const res = await fetch(`${GAS_URL}?action=getMenu&token=${API_TOKEN}`);
                const data = await res.json();
                if (data.success && data.menu) {
                    masterMenu = data.menu;
                    localStorage.setItem('nongki_menu', JSON.stringify(masterMenu));
                }
            } catch (e) {
                console.warn('Gagal ambil menu server, pakai cache lokal');
                masterMenu = JSON.parse(localStorage.getItem('nongki_menu') || '[]');
            }
            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const cats = ['ALL', ...new Set(masterMenu.map(m => m.kategori || 'Lainnya'))];
            const container = document.getElementById('categoryContainer');
            container.innerHTML = cats.map(c => `
                <button onclick="filterCategory('${c}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold ${activeCategory === c ? 'bg-amber-600 text-white border border-amber-500' : 'bg-stone-800 text-stone-400 border border-stone-700'} whitespace-nowrap">
                    ${c === 'ALL' ? 'Semua' : c}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const items = activeCategory === 'ALL' ? masterMenu : masterMenu.filter(m => (m.kategori || 'Lainnya') === activeCategory);
            
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-8 text-stone-500 text-sm">Tidak ada menu.</div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div onclick="addToCart('${item.id}')" class="bg-stone-800 p-3 rounded-xl border border-stone-700 hover:border-amber-500/50 transition cursor-pointer flex flex-col justify-between active:scale-95">
                    <div>
                        <div class="text-xs font-medium text-stone-400 mb-1">${item.kategori || 'Umum'}</div>
                        <div class="font-bold text-sm text-stone-200 line-clamp-2">${item.nama}</div>
                    </div>
                    <div class="mt-2 text-amber-400 font-bold text-sm">Rp ${Number(item.harga).toLocaleString('id-ID')}</div>
                </div>
            `).join('');
        }

        // CART LOGIC
        function addToCart(productId) {
            const prod = masterMenu.find(m => String(m.id) === String(productId));
            if (!prod) return;

            const existing = cart.find(c => String(c.id) === String(productId));
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id: prod.id, nama: prod.nama, harga: Number(prod.harga), qty: 1 });
            }
            saveLocalCart();
            renderCartUI();
        }

        function updateQty(productId, delta) {
            const idx = cart.findIndex(c => String(c.id) === String(productId));
            if (idx !== -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) cart.splice(idx, 1);
            }
            saveLocalCart();
            renderCartUI();
        }

        function saveLocalCart() {
            localStorage.setItem('nongki_active_cart', JSON.stringify(cart));
        }

        function loadLocalCart() {
            cart = JSON.parse(localStorage.getItem('nongki_active_cart') || '[]');
        }

        function renderCartUI() {
            const totalItem = cart.reduce((a, b) => a + b.qty, 0);
            const totalPrice = cart.reduce((a, b) => a + (b.harga * b.qty), 0);

            const cartBar = document.getElementById('cartBar');
            if (totalItem > 0) {
                cartBar.classList.remove('hidden');
                document.getElementById('cartBadge').innerText = totalItem;
                document.getElementById('cartTotalBar').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                cartBar.classList.add('hidden');
                closeCartModal();
            }

            // Render Modal List
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = cart.map(item => `
                <div class="py-2.5 flex justify-between items-center">
                    <div>
                        <div class="font-bold text-sm text-stone-200">${item.nama}</div>
                        <div class="text-xs text-amber-400 font-semibold">Rp ${item.harga.toLocaleString('id-ID')}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQty('${item.id}', -1)" class="w-7 h-7 rounded-lg bg-stone-700 text-stone-200 font-bold text-sm">-</button>
                        <span class="text-sm font-bold w-4 text-center">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-7 h-7 rounded-lg bg-amber-600 text-white font-bold text-sm">+</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('modalTotalAmount').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        function openCartModal() {
            if (cart.length > 0) document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        // TRANSACTION PROCESSING
        async function processPayment(metode) {
            if (cart.length === 0) return;

            const btnCash = document.getElementById('btnPayCash');
            const btnQRIS = document.getElementById('btnPayQRIS');
            btnCash.disabled = true;
            btnQRIS.disabled = true;

            const totalPrice = cart.reduce((a, b) => a + (b.harga * b.qty), 0);
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            const summaryText = cart.map(c => `${c.nama} (${c.qty})`).join(', ');

            const localTx = {
                idEvent: 'EVT-' + Date.now(),
                idTransaksi: 'TX-' + Date.now(),
                timestamp: getTodayWIB() + ' ' + new Date().toTimeString().split(' ')[0],
                jenisEvent: 'Penjualan Baru',
                ringkasan: summaryText,
                jumlah: totalQty,
                totalHarga: totalPrice,
                metode: metode,
                status: 'Lokal (Pending)',
                dateStr: getTodayWIB()
            };

            // 1. Simpan Lokal Dulu & Re-render Langsung
            const offlineQueue = JSON.parse(localStorage.getItem('nongki_offline_queue') || '[]');
            offlineQueue.push(localTx);
            localStorage.setItem('nongki_offline_queue', JSON.stringify(offlineQueue));

            cart = [];
            saveLocalCart();
            renderCartUI();
            renderRecentTransactions();
            calculateGlobalTotal();

            // 2. Kirim ke Server
            try {
                const payload = {
                    token: API_TOKEN,
                    idEvent: localTx.idEvent,
                    idTransaksi: localTx.idTransaksi,
                    timestamp: localTx.timestamp,
                    jenisEvent: localTx.jenisEvent,
                    ringkasan: localTx.ringkasan,
                    jumlah: localTx.jumlah,
                    totalHarga: localTx.totalHarga,
                    metode: localTx.metode
                };

                const res = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (data.success) {
                    // Hapus dari antrean offline jika sukses
                    const queue = JSON.parse(localStorage.getItem('nongki_offline_queue') || '[]');
                    const updatedQueue = queue.filter(q => q.idEvent !== localTx.idEvent);
                    localStorage.setItem('nongki_offline_queue', JSON.stringify(updatedQueue));
                    fetchGlobalTotal();
                    fetchServerHistory();
                }
            } catch (e) {
                console.warn('Gagal sinkron server, tersimpan lokal.');
            } finally {
                btnCash.disabled = false;
                btnQRIS.disabled = false;
                closeCartModal();
            }
        }

        // GLOBAL INCOME & RECENT TRANSACTIONS
        function calculateGlobalTotal() {
            const today = getTodayWIB();
            const offlineQueue = JSON.parse(localStorage.getItem('nongki_offline_queue') || '[]');
            const localTodayTotal = offlineQueue
                .filter(q => q.dateStr === today)
                .reduce((a, b) => a + Number(b.totalHarga || 0), 0);

            const combinedTotal = serverGlobalIncome + localTodayTotal;
            document.getElementById('globalTodayTotal').innerText = `Rp ${combinedTotal.toLocaleString('id-ID')}`;
            document.getElementById('offlineQueueCount').innerText = `${offlineQueue.length} antrean lokal`;
        }

        async function fetchGlobalTotal() {
            try {
                const res = await fetch(`${GAS_URL}?action=getGlobalIncome&token=${API_TOKEN}&tanggal=${getTodayWIB()}`);
                const data = await res.json();
                if (data.success) {
                    serverGlobalIncome = Number(data.globalIncome || data.total || 0);
                    document.getElementById('syncTimestamp').innerText = 'Terakhir sinkron: ' + new Date().toLocaleTimeString('id-ID');
                }
            } catch (e) {
                console.warn('Gagal fetch global total');
            }
            calculateGlobalTotal();
        }

        async function fetchServerHistory() {
            try {
                const res = await fetch(`${GAS_URL}?action=getHistory&token=${API_TOKEN}`);
                const data = await res.json();
                if (data.success) {
                    serverHistory = data.history || data.data || [];
                    renderRecentTransactions();
                }
            } catch (e) {
                console.warn('Gagal fetch history server');
            }
        }

        function renderRecentTransactions() {
            const container = document.getElementById('historyList');
            const offlineQueue = JSON.parse(localStorage.getItem('nongki_offline_queue') || '[]');

            const allTx = [
                ...offlineQueue.map(q => ({ ...q, isLocal: true })),
                ...serverHistory.map(s => ({
                    idEvent: s.idEvent,
                    ringkasan: s.namaProduk,
                    totalHarga: s.totalHarga,
                    timestamp: s.timestamp,
                    metode: s.statusEvent,
                    isLocal: false
                }))
            ];

            if (allTx.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-stone-500 text-sm">Belum ada riwayat transaksi.</div>`;
                return;
            }

            container.innerHTML = allTx.slice(0, 30).map(tx => `
                <div class="bg-stone-800 p-3 rounded-xl border ${tx.isLocal ? 'border-amber-500/60 bg-amber-950/10' : 'border-stone-700'} flex justify-between items-center">
                    <div>
                        <div class="font-bold text-xs text-stone-200">${tx.ringkasan || 'Transaksi'}</div>
                        <div class="text-[10px] text-stone-400 mt-0.5 flex items-center gap-1">
                            <span>${tx.timestamp || ''}</span>
                            ${tx.isLocal ? '<span class="text-amber-400 font-bold">(Lokal)</span>' : '<span class="text-emerald-400">(Server)</span>'}
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-bold text-xs text-amber-400">Rp ${Number(tx.totalHarga || 0).toLocaleString('id-ID')}</div>
                        <div class="text-[9px] text-stone-500 uppercase">${tx.metode || 'TUNAI'}</div>
                    </div>
                </div>
            `).join('');
        }

        // LAPORAN FETCH & RENDER
        async function loadReportData() {
            const omsetEl = document.getElementById('reportOmset');
            const txCountEl = document.getElementById('reportTxCount');
            const listEl = document.getElementById('reportItemList');

            listEl.innerHTML = `<div class="text-stone-500 text-center py-4">Memuat data laporan...</div>`;

            try {
                const res = await fetch(`${GAS_URL}?action=getReport&token=${API_TOKEN}`);
                const data = await res.json();
                
                if (data.success && data.report) {
                    const r = data.report;
                    omsetEl.innerText = `Rp ${Number(r.totalOmset || 0).toLocaleString('id-ID')}`;
                    txCountEl.innerText = r.totalTransaksi || 0;

                    const items = r.itemTerjual || {};
                    const itemKeys = Object.keys(items);

                    if (itemKeys.length === 0) {
                        listEl.innerHTML = `<div class="text-stone-500 text-center py-4">Belum ada data item.</div>`;
                    } else {
                        listEl.innerHTML = itemKeys.map(k => `
                            <div class="py-2 flex justify-between items-center">
                                <span class="font-medium text-stone-300">${k}</span>
                                <div class="text-right">
                                    <span class="font-bold text-amber-400">${items[k].qty}x</span>
                                    <span class="text-[10px] text-stone-400 block">Rp ${Number(items[k].omset || 0).toLocaleString('id-ID')}</span>
                                </div>
                            </div>
                        `).join('');
                    }
                    return;
                }
            } catch (e) {
                console.warn('Gagal ambil laporan server, memuat rekap lokal...');
            }

            // Fallback Laporan Lokal
            const offlineQueue = JSON.parse(localStorage.getItem('nongki_offline_queue') || '[]');
            const totalOmset = offlineQueue.reduce((a, b) => a + Number(b.totalHarga || 0), 0);
            omsetEl.innerText = `Rp ${totalOmset.toLocaleString('id-ID')}`;
            txCountEl.innerText = offlineQueue.length;
            listEl.innerHTML = `<div class="text-stone-500 text-center py-4">Menampilkan ringkasan antrean lokal offline (${offlineQueue.length} transaksi).</div>`;
        }

        function refreshData() {
            fetchGlobalTotal();
            fetchServerHistory();
        }
    </script>
</body>
</html>
