<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nongki — Uji Penyimpanan Offline</title>
<style>body{font:15px system-ui;background:#f7f7f3;color:#163e2b;margin:0;padding:20px}main{max-width:650px;margin:auto}button{padding:12px 16px;margin:5px;border:0;border-radius:10px;background:#174b32;color:white;font-weight:600}button:disabled{opacity:.5}pre{background:#fff;padding:16px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}small{color:#555}</style></head>
<body><main><h1>Uji Offline Nongki</h1>
<p>Halaman khusus pengujian. Tidak mengirim data ke Google Sheets dan tidak mengubah transaksi aplikasi produksi.</p>
<button id="create">Catat 1 Es Kopi Susu (Rp10.000)</button><button id="cancel">Batalkan transaksi terakhir</button><button id="refresh">Lihat data lokal</button><button id="test">Jalankan uji otomatis</button>
<p><small>Setelah mencatat, coba refresh halaman atau matikan internet. Data seharusnya tetap ada.</small></p><pre id="output">Memuat...</pre>
<script type="module">
import { recordTransaction, cancelTransaction, getAllRecords, getPendingOutbox, getSalesSummary } from './src/db.js';
const output = document.querySelector('#output');
let latestId = null;
async function show() {
  const tx = (await getAllRecords('transactions')).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const queue = await getPendingOutbox();
  latestId = tx[0]?.id || null;
  const active = tx.filter(t=>t.status==='active');
  output.textContent = JSON.stringify({
    totalTransaksi:tx.length,
    transaksiAktif:active.length,
    transaksiBatal:tx.length-active.length,
    pemasukanBersih:active.reduce((sum,t)=>sum+t.total,0),
    antreanBelumSinkron:queue.length,
    transaksiTerbaru:tx.slice(0,5).map(t=>({id:t.id,status:t.status,total:t.total,tanggal:t.businessDate}))
  },null,2);
}
async function run(action) {
  try { output.textContent='Memproses...'; await action(); await show(); }
  catch(e) { output.textContent='ERROR: '+e.message; }
}
document.querySelector('#create').onclick=()=>run(()=>recordTransaction({userId:'test',deviceId:'browser-test',items:[{productId:'kopi-susu',productName:'Es Kopi Susu',quantity:1,unitPrice:10000}]}));
document.querySelector('#cancel').onclick=()=>run(async()=>{if(!latestId)throw Error('Belum ada transaksi.');await cancelTransaction(latestId,{userId:'test',reason:'Uji pembatalan'});});
document.querySelector('#refresh').onclick=()=>run(async()=>{});
document.querySelector('#test').onclick=()=>run(async()=>{
  const before=(await getPendingOutbox()).length;
  const testProductId='test-'+crypto.randomUUID();
  const tx=await recordTransaction({userId:'test',items:[{productId:testProductId,productName:'Tes',quantity:2,unitPrice:3000}]});
  if(tx.total!==6000)throw Error('Perhitungan total salah');
  if((await getPendingOutbox()).length!==before+1)throw Error('Event pencatatan tidak masuk antrean');
  await cancelTransaction(tx.id,{userId:'test'});
  const saved=(await getAllRecords('transactions')).find(t=>t.id===tx.id);
  if(saved?.status!=='canceled')throw Error('Pembatalan gagal disimpan');
  if((await getPendingOutbox()).length!==before+2)throw Error('Event pembatalan tidak masuk antrean');
  const summary=await getSalesSummary({fromDate:tx.businessDate,toDate:tx.businessDate});
  if(summary.netRevenue < 0 || summary.products.some(p=>p.productId===testProductId)) {
    throw Error('Transaksi batal masih masuk ringkasan penjualan');
  }
  const history=(await getAllRecords('transactions')).find(t=>t.id===tx.id);
  if(!history || history.status!=='canceled')throw Error('Transaksi batal hilang dari riwayat');
  alert('Uji dasar lulus: pencatatan, total, pembatalan, riwayat tetap ada, ringkasan mengecualikan transaksi batal, dan antrean lokal.');
});
show().catch(e=>output.textContent='ERROR: '+e.message);
</script></main></body></html>
