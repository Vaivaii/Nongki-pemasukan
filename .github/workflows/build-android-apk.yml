name: Build Nongki Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/capacitor-apk
    paths:
      - 'index.html'
      - 'service-worker.js'
      - 'manifest.json'
      - 'icon-*.png'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node dependencies
        run: npm install

      - name: Prepare bundled web assets
        shell: bash
        run: |
          mkdir -p www
          cp index.html www/
          cp service-worker.js www/
          cp manifest.json www/
          for f in icon-*.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done

      - name: Generate Android project if absent
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Nongki-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
